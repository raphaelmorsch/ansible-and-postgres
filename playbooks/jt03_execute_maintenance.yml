---
- name: JT03 — Executar Manutenção PostgreSQL
  hosts: postgresql
  gather_facts: false
  vars:
    vault_url: "{{ vault_base_url }}"
    vault_secret_name: "{{ vault_secret | default('postgresql-prod') }}"
    itsm_url: "{{ itsm_base_url }}"
    max_tables: 2
    excluded_tables: "{{ pg_excluded_tables | default([]) }}"
  tasks:
    - name: Fail early when ticket was not created
      ansible.builtin.fail:
        msg: "Nenhum ticket ativo. Abortando manutenção."
      when: not (ticket_created | default(false) | bool)

    - name: Fetch database credentials from Mock Vault
      ansible.builtin.uri:
        url: "{{ vault_url }}/secrets/{{ vault_secret_name }}"
        method: GET
        return_content: true
        status_code: 200
        validate_certs: false
      register: vault_secret_resp
      no_log: true
      delegate_to: localhost

    - name: Set PostgreSQL connection facts from vault
      ansible.builtin.set_fact:
        pg_user: "{{ vault_secret_resp.json.username }}"
        pg_password: "{{ vault_secret_resp.json.password }}"
        pg_db: "{{ vault_secret_resp.json.database }}"
        pg_host: "{{ vault_secret_resp.json.host | default(inventory_hostname) }}"
        pg_port: "{{ vault_secret_resp.json.port | default(5432) }}"
      no_log: true

    - name: Safety checks before maintenance
      edb.epas_postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        # Compatible with PostgreSQL 10+ (OpenShift template image)
        query: |
          SELECT
            (SELECT count(*) FROM pg_stat_activity WHERE state <> 'idle') AS active_connections,
            0 AS basebackup_running,
            (
              SELECT count(*)
              FROM pg_stat_activity
              WHERE query ILIKE 'vacuum%'
                AND state <> 'idle'
            ) AS vacuum_running;
      register: safety
      delegate_to: localhost

    - name: Evaluate safety gate
      ansible.builtin.set_fact:
        safety_ok: >-
          {{
            (safety.query_result[0].active_connections | int)
              < (pg_max_connections_for_maintenance | default(50) | int)
            and (safety.query_result[0].basebackup_running | int) == 0
            and (force_maintenance_window | default(true) | bool)
          }}
        safety_details: "{{ safety.query_result[0] | combine({'in_maintenance_window': (force_maintenance_window | default(true) | bool)}) }}"

    - name: Update ticket when safety checks fail
      ansible.builtin.uri:
        url: "{{ itsm_url }}/api/tickets/{{ ticket_id }}"
        method: PATCH
        body_format: json
        validate_certs: false
        status_code: 200
        body:
          status: pending
          comment: >-
            Condições de segurança não atendidas.
            active_connections={{ safety_details.active_connections }},
            basebackup_running={{ safety_details.basebackup_running }},
            in_maintenance_window={{ safety_details.in_maintenance_window }}.
            Aguardando intervenção do DBA.
      delegate_to: localhost
      when: not (safety_ok | bool)

    - name: Abort when safety checks fail
      ansible.builtin.fail:
        msg: "Safety checks failed. Ticket marcado como pending."
      when: not (safety_ok | bool)

    - name: Mark ticket in progress
      ansible.builtin.uri:
        url: "{{ itsm_url }}/api/tickets/{{ ticket_id }}"
        method: PATCH
        body_format: json
        validate_certs: false
        status_code: 200
        body:
          status: in_progress
          comment: "Diagnóstico concluído. Iniciando manutenção controlada."
      delegate_to: localhost

    - name: Select tables for this run
      ansible.builtin.set_fact:
        tables_to_maintain: "{{ _filtered[:max_tables | int] }}"
        tables_needing_approval: "{{ _approval }}"
      vars:
        _filtered: >-
          {{
            (tables_needing_maintenance | default([]))
            | rejectattr('fq_name', 'in', excluded_tables)
            | rejectattr('action', 'equalto', 'approve_required')
            | list
          }}
        _approval: >-
          {{
            (tables_needing_maintenance | default([]))
            | selectattr('action', 'equalto', 'approve_required')
            | list
          }}

    - name: Capture before metrics
      edb.epas_postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: |
          SELECT
            schemaname,
            relname AS table_name,
            n_live_tup,
            n_dead_tup,
            ROUND(100.0 * n_dead_tup / NULLIF(n_live_tup + n_dead_tup, 0), 2) AS dead_tuple_percent,
            pg_size_pretty(pg_total_relation_size(schemaname || '.' || relname)) AS total_size
          FROM pg_stat_user_tables
          WHERE (schemaname || '.' || relname) IN ({{ "'" + (tables_to_maintain | map(attribute='fq_name') | list | join("','")) + "'" }});
      register: before_metrics
      delegate_to: localhost
      when: tables_to_maintain | length > 0

    - name: Run VACUUM ANALYZE for selected tables
      edb.epas_postgresql.postgresql_query:
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        login_db: "{{ pg_db }}"
        query: "VACUUM (ANALYZE) {{ item.fq_name }};"
        autocommit: true
      loop: "{{ tables_to_maintain }}"
      loop_control:
        label: "{{ item.fq_name }}"
      delegate_to: localhost
      when: tables_to_maintain | length > 0

    - name: Comment progress on ticket per table
      ansible.builtin.uri:
        url: "{{ itsm_url }}/api/tickets/{{ ticket_id }}"
        method: PATCH
        body_format: json
        validate_certs: false
        status_code: 200
        body:
          status: in_progress
          comment: "VACUUM ANALYZE executado na tabela {{ item.fq_name }} (dead={{ item.dead_tuple_percent }}%)."
      loop: "{{ tables_to_maintain }}"
      loop_control:
        label: "{{ item.fq_name }}"
      delegate_to: localhost
      when: tables_to_maintain | length > 0

    - name: Note approval-required objects on ticket
      ansible.builtin.uri:
        url: "{{ itsm_url }}/api/tickets/{{ ticket_id }}"
        method: PATCH
        body_format: json
        validate_certs: false
        status_code: 200
        body:
          status: in_progress
          comment: >-
            Objetos acima do limiar de aprovação automática (não executados):
            {{ tables_needing_approval | map(attribute='fq_name') | list | join(', ') }}.
      delegate_to: localhost
      when: tables_needing_approval | length > 0

    - name: Fail when nothing could be auto-maintained
      ansible.builtin.fail:
        msg: >-
          Nenhuma tabela elegível para correção automática.
          Objetos aguardando aprovação: {{ tables_needing_approval | map(attribute='fq_name') | list }}.
      when:
        - tables_to_maintain | length == 0
        - tables_needing_approval | length > 0

    - name: Publish maintenance artifacts
      ansible.builtin.set_stats:
        data:
          maintained_tables: "{{ tables_to_maintain }}"
          before_metrics: "{{ before_metrics.query_result | default([]) }}"
          maintenance_actions_done: "{{ tables_to_maintain | map(attribute='fq_name') | map('regex_replace', '^(.*)$', 'VACUUM ANALYZE em \\1') | list }}"
          tables_needing_approval: "{{ tables_needing_approval }}"
          safety_details: "{{ safety_details }}"
          ticket_id: "{{ ticket_id }}"
        per_host: false

    - name: Show maintenance summary
      ansible.builtin.debug:
        msg:
          ticket_id: "{{ ticket_id }}"
          maintained_tables: "{{ tables_to_maintain | map(attribute='fq_name') | list }}"
          tables_needing_approval: "{{ tables_needing_approval | map(attribute='fq_name') | list }}"
          safety: "{{ safety_details }}"
