---
- name: EDA action — launch deadlock workflow on controller
  hosts: localhost
  gather_facts: false
  vars:
    controller_url: "{{ lookup('env', 'AAP_URL') | default('https://aap-aap.apps.cluster-d796h.dyn.redhatworkshops.io', true) }}"
    controller_user: "{{ lookup('env', 'AAP_USERNAME') | default('admin', true) }}"
    controller_password: "{{ lookup('env', 'AAP_PASSWORD') | default('083RpsIxThJl', true) }}"
    deadlock_wf_name: "{{ lookup('env', 'DEADLOCK_WORKFLOW_NAME') | default('WF — Resposta a Deadlock PostgreSQL', true) }}"
    deadlock_event_payload: "{{ deadlock_event if (deadlock_event is defined) else (ansible_eda.event.payload | default({})) }}"
  tasks:
    - name: Find workflow template by name
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/workflow_job_templates/?name={{ deadlock_wf_name | urlencode }}"
        method: GET
        user: "{{ controller_user }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: wf_lookup

    - name: Fail when workflow is not found
      ansible.builtin.fail:
        msg: "Workflow {{ deadlock_wf_name }} não encontrado no controller."
      when: (wf_lookup.json.count | int) == 0

    - name: Launch workflow with deadlock event payload
      ansible.builtin.uri:
        url: "{{ controller_url }}/api/controller/v2/workflow_job_templates/{{ wf_lookup.json.results[0].id }}/launch/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        status_code: 201
        body:
          extra_vars:
            deadlock_event: "{{ deadlock_event_payload }}"
      register: wf_launch

    - name: Show launched workflow
      ansible.builtin.debug:
        msg:
          workflow: "{{ deadlock_wf_name }}"
          workflow_job_id: "{{ wf_launch.json.id }}"
          event: "{{ deadlock_event_payload }}"
